name: Update MH Wilds Builds

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-builds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build updater
        run: node scraper.js

      - name: Commit and push updated builds
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add builds.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sync MH Wilds builds" && git push)
