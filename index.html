<!DOCTYPE html>
<html lang="en" data-theme="gold">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MH Wilds Pro Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="top-bar">
      <h1>MH Wilds Pro Builder</h1>
      <div class="theme-wrap">
        <label for="theme-select" class="inline-lbl">Theme:</label>
        <select id="theme-select">
          <option value="gold">Forbidden Gold</option>
          <option value="frenzy">Gore Frenzy</option>
          <option value="rey">Rey Lightning</option>
          <option value="crimson">Rathalos Red</option>
          <option value="arkveld">Arkveld White</option>
        </select>
      </div>
    </div>
    <div class="tabs">
      <button type="button" class="tab active" data-tab="meta">Meta Builds</button>
      <button type="button" class="tab" data-tab="ai">Monster AI</button>
      <button type="button" class="tab" data-tab="weapon-ai">Weapon AI</button>
    </div>
  </header>

  <section id="meta-view">
    <div class="controls">
      <label>Primary Weapon Class</label>
      <select id="weapon-select"></select>
      <label>Weapon Sub-Type / Shelling / Phial / Ammo</label>
      <select id="subtype-select"></select>
      <label>Target Monster (All Monsters + 10★ Arch-Tempered)</label>
      <select id="monster-select"></select>
    </div>
    <div id="monster-banner"></div>
    <div id="builds-list"></div>
  </section>

  <section id="ai-view" class="hidden">
    <div class="ai-box">
      <label>1. Primary Weapon Class</label>
      <select id="ai-weapon"></select>
      <label>2. Sub-Type & Artian / Gogmazios (TU4) Reinforcement</label>
      <select id="ai-reinforce">
        <option value="artian-atk">Artian Tier 8 (3x Attack Infusion • [3-3-3] Slots)</option>
        <option value="artian-aff">Artian Tier 8 (2x Affinity + 1x Sharpness • Prevents Overcap)</option>
        <option value="gog-tu4">Gogmazios TU4 Tree (High Element/Raw + Group Skill Roll)</option>
        <option value="monster">Standard Apex / Monster Tree</option>
      </select>
      <label>3. Target Monster</label>
      <select id="ai-monster"></select>
      <label>4. Custom Timeworn / RNG Charm (Optional)</label>
      <input type="text" id="ai-charm" placeholder="e.g., Attack 3 + WEX 1 [3-1-0] or leave blank for best craftable">
      <label>5. Hunting Strategy</label>
      <select id="ai-style">
        <option value="meta">10★ Max Meta DPS (3pc Gamma Lord's Soul + 2pc Set Bonus)</option>
        <option value="counter">Elemental & Blight Counter</option>
        <option value="comfy">Immortal Anti-Cart (Arkveld's Hunger + Lord's Soul)</option>
        <option value="partbreak">Wound & Partbreaker Farm (Carver Pro)</option>
      </select>
      <button type="button" id="ai-generate">Generate Full Endgame Loadout</button>
    </div>
    <div id="ai-result"></div>
  </section>

  <section id="weapon-ai-view" class="hidden"></section>

  <script src="app.js?v=10"></script>
  <script src="weapons-ai.js?v=6"></script>
</body>
</html>
