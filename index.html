<!DOCTYPE html>
<html lang="en" data-theme="gold">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MH Wilds Ultimate Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="top-bar">
      <h1>MH Wilds Pro Builder</h1>
      <select id="theme-select">
        <option value="gold">Forbidden Gold</option>
        <option value="frenzy">Gore Frenzy</option>
        <option value="rey">Rey Lightning</option>
        <option value="crimson">Rathalos Red</option>
        <option value="arkveld">Arkveld White</option>
      </select>
    </div>
    <div class="tabs">
      <button type="button" class="tab active" data-tab="meta">Meta Builds</button>
      <button type="button" class="tab" data-tab="ai">Monster AI</button>
      <button type="button" class="tab" data-tab="weapon-ai">Weapon AI</button>
    </div>
  </header>

  <section id="meta-view">
    <div class="controls">
      <label>Weapon Class</label>
      <select id="weapon-select"></select>
      <label>Target Monster (All Monsters + Arch-Tempered)</label>
      <select id="monster-select"></select>
    </div>
    <div id="monster-banner"></div>
    <div id="builds-list"></div>
  </section>

  <section id="ai-view" class="hidden">
    <div class="ai-box">
      <label>1. Your Weapon Class</label>
      <select id="ai-weapon"></select>
      <label>2. Target Monster</label>
      <select id="ai-monster"></select>
      <label>3. Hunting Strategy</label>
      <select id="ai-style">
        <option value="meta">10★ Max Meta DPS (Gamma Lord's Soul)</option>
        <option value="counter">Elemental & Blight Counter</option>
        <option value="comfy">Immortal / Anti-Cart Tank</option>
        <option value="partbreak">Wound & Partbreaker Farm</option>
      </select>
      <button type="button" id="ai-generate">Generate Full Gear & Jewel Loadout</button>
    </div>
    <div id="ai-result"></div>
  </section>

  <section id="weapon-ai-view" class="hidden"></section>

  <script src="app.js?v=9"></script>
  <script src="weapons-ai.js?v=5"></script>
  <script>
    document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
      document.getElementById('weapon-ai-view').classList.toggle('hidden', btn.dataset.tab !== 'weapon-ai');
    }));
  </script>
</body>
</html>
